// Editor defaults are loaded before the user's saved engine configuration.
seta ca_grid 16
seta vid_multisample 8
seta ftebroom_grid_aa 1.005
seta gl_texture_anisotropy 16
seta gl_texturemode GL_NEAREST_MIPMAP_NEAREST

// A useful desktop window on first launch, including Linux terminal launches.
seta vid_width 1280
seta vid_height 800
