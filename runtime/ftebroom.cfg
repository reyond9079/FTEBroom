exec display-resolution.cfg
plug_load ftebroom
set ftebroom_offline_brush_edit 1
// Function keys are left unbound by the editor.
unbind F1
unbind F2
unbind F3
unbind F4
unbind F5
unbind F6
unbind F7
unbind F8
unbind F9
unbind F10
unbind F11
unbind F12
set ca_show 1
set ca_editormode 4
set ftebroom_clip_keep 0
set ca_brush_viewsize 1024
set ca_newbrushtexture ftebroom/grid
r_fullbright 1
vid_conautoscale 1
ftebroom_start_map
in 6 ftebroom
set ftebroom_tool 0
set ftebroom_plane 0
set ftebroom_forward 0
set ftebroom_right 0
set ftebroom_grid_visible 1
set ftebroom_sky_overlays 0
set ftebroom_bounds_visible 0
seta ftebroom_show_edges 1
set ftebroom_mouse_x 640
set ftebroom_mouse_y 400
set ftebroom_alt 0
set ftebroom_selection_count 0
set ftebroom_ctrl 0
set ftebroom_shift 0
set ftebroom_ctx_view 0
set ftebroom_ctx_selection 0

set ftebroom_drag_mode 0
set ftebroom_texture_lock 1
set ftebroom_uv_lock 0

set ftebroom_autosave_interval 10
set ftebroom_autosave_count 50

set ftebroom_grid_exp 4
set ftebroom_grid_snap 1
set ftebroom_grid_alpha 0.65
set ftebroom_wheel_grid 1
set ftebroom_wheel_invert 0
set ftebroom_map_bounds "-65536 -65536 -65536 65536 65536 65536"

// Quake 3 texture density for newly created surfaces.
seta ftebroom_default_uv_scale 0.5

seta ftebroom_instantiate_defaults 0
